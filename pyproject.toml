[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "filings-lens"
version = "0.1.0"
description = "Cited, read-only semantic questions over SEC EDGAR filings (10-K, 10-Q, 8-K), with optional MIT Palimpzest semantic operators."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "LevelUpWorldHub" }]
keywords = ["sec", "edgar", "10-k", "llm", "citations", "palimpzest", "research"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Office/Business :: Financial",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = []

[project.optional-dependencies]
palimpzest = ["palimpzest>=1.5"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
filings-lens = "filings_lens.cli:main"

[project.urls]
Homepage = "https://github.com/LevelUpWorldHub/filings-lens"
Issues = "https://github.com/LevelUpWorldHub/filings-lens/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/filings_lens"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "eval", "scripts", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM"]
# S310: urlopen is only reached after the SEC host allowlist (edgar) or an env-configured base URL (llm).
ignore = ["S101", "S310", "B905", "SIM905"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B"]
